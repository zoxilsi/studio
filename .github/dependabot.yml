version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # One predictable maintenance PR per month keeps the project current
      # without filling the pull-request list.
      interval: monthly
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    versioning-strategy: increase-if-necessary
    groups:
      safe-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades often require migrations and should be proposed and
      # tested intentionally by a maintainer.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
